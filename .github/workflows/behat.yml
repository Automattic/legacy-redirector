name: Behat Tests

on:
  push:
    paths:
      - '.github/workflows/behat.yml'
      - '**.php'
      - '**.feature'
      - 'behat.yml'
      - 'composer.json'
      - '.wp-env.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/behat.yml'
      - '**.php'
      - '**.feature'
      - 'behat.yml'
      - 'composer.json'
      - '.wp-env.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  behat:
    name: Behat Tests (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported WP with the lowest supported PHP.
          - wordpress: '6.8'
            php: '8.3'
          # Latest WP with the latest PHP.
          - wordpress: 'master'
            php: '8.5'

    env:
      WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}
      # Behat drives WP-CLI inside the wp-env container, so the matrix PHP
      # version has to reach wp-env, not just the runner.
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Start wp-env
        run: npx wp-env start

      - name: Run Behat tests
        run: composer test:behat

      - name: Rerun failed tests
        if: failure()
        run: composer test:behat-rerun
