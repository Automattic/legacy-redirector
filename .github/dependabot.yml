version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "Actions"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      composer-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "Composer"
      include: "scope"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "npm"
      include: "scope"
    open-pull-requests-limit: 5
